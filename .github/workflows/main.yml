
name: Build KanisVPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  SING_BOX_TAG: v1.10.7
  ANDROID_NDK_VERSION: 26.1.10909125

jobs:
  build:
    name: Compile KanisVPN
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      # 1. Download source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Detect Android project directory
      - name: Find project directory
        shell: bash
        run: |
          PROJECT_FILE=$(find . -maxdepth 5 \
            -type f -name settings.gradle.kts \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(find . -maxdepth 5 \
              -type f -name settings.gradle \
              -print -quit)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android Gradle project not found!"
            find . -maxdepth 3 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          PROJECT_DIR=${PROJECT_DIR#./}

          if [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found in: $PROJECT_DIR"

          test -f "$PROJECT_DIR/app/build.gradle.kts"

      # 3. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 5. Setup Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      # 6. Install Android components
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      # 7. Build sing-box
      - name: Build sing-box libbox
        shell: bash
        run: |
          git clone --depth 1 \
            --branch "$SING_BOX_TAG" \
            https://github.com/SagerNet/sing-box.git \
            /tmp/sing-box

          cd /tmp/sing-box

          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.4
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.4

          export PATH="$(go env GOPATH)/bin:$PATH"

          gomobile init

          go run ./cmd/internal/build_libbox -target android

          if [ ! -f libbox.aar ]; then
            echo "ERROR: libbox.aar not generated"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/$PROJECT_DIR/app/libs"

          cp libbox.aar \
            "$GITHUB_WORKSPACE/$PROJECT_DIR/app/libs/libbox.aar"

          echo "libbox.aar successfully copied"

      # 8. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 9. Create debug keystore
      - name: Create debug keystore
        run: |
          mkdir -p ~/.android

          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # 10. Compile APK
      - name: Compile KanisVPN APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleRelease \
            --no-daemon \
            --stacktrace

      # 11. Upload APK
      - name: Upload KanisVPN APK
        uses: actions/upload-artifact@v4
        with:
          name: KanisVPN-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
          
