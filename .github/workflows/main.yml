
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Décompresser KanisVPN
        run: |
          mkdir -p source
          ZIP=$(find . -maxdepth 1 -name 'KanisVPN-corrige-xray.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP KanisVPN introuvable"
            exit 1
          fi

          unzip -q "$ZIP" -d source

          if [ ! -f source/KanisVPN/settings.gradle.kts ]; then
            echo "Projet Android introuvable"
            exit 1
          fi

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Télécharger Xray
        run: |
          git clone --depth 1 https://github.com/2dust/AndroidLibXrayLite.git xray-src

      - name: Installer Go
        uses: actions/setup-go@v6
        with:
          go-version-file: xray-src/go.mod

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Installer NDK
        run: |
          sdkmanager --install "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Installer gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Compiler la bibliothèque Xray
        working-directory: xray-src
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

          mkdir -p assets data
          bash gen_assets.sh download
          cp -v data/*.dat assets/

          gomobile init
          go mod tidy

          gomobile bind -v -androidapi 24 -trimpath -ldflags='-s -w -buildid= -checklinkname=0' ./

      - name: Intégrer Xray dans KanisVPN
        run: |
          mkdir -p source/KanisVPN/app/libs
          cp xray-src/libv2ray.aar source/KanisVPN/app/libs/

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler APK
        working-directory: source/KanisVPN
        run: gradle assembleDebug --stacktrace

      - name: Télécharger APK
        uses: actions/upload-artifact@v4
        with:
          name: KanisVPN-apk
          path: source/KanisVPN/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
