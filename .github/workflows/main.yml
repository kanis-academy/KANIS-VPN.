
name: Build KanisVPN APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  SING_BOX_TAG: v1.10.7
  ANDROID_NDK_VERSION: 26.1.10909125

jobs:
  build:
    name: Compile KanisVPN
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      # 1. Download project
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 4. Install Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      # 5. Install Android SDK components
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      # 6. Download and compile sing-box
      - name: Build sing-box libbox
        shell: bash
        run: |
          git clone --depth 1 \
            --branch "$SING_BOX_TAG" \
            https://github.com/SagerNet/sing-box.git \
            /tmp/sing-box

          cd /tmp/sing-box

          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.4
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.4

          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

          export PATH="$(go env GOPATH)/bin:$PATH"

          gomobile init

          go run ./cmd/internal/build_libbox -target android

          if [ ! -f libbox.aar ]; then
            echo "ERROR: libbox.aar was not generated"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/app/libs"

          cp libbox.aar "$GITHUB_WORKSPACE/app/libs/libbox.aar"

      # 7. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 8. Check project
      - name: Check Android project
        run: |
          echo "Checking project files..."
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/libs/libbox.aar

      # 9. Compile APK
      - name: Compile KanisVPN Release APK
        run: |
          gradle assembleRelease \
            --no-daemon \
            --stacktrace

      # 10. Upload APK
      - name: Upload KanisVPN APK
        uses: actions/upload-artifact@v4
        with:
          name: KanisVPN-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
          
