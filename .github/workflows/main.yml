name: Build KanisVPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  SING_BOX_TAG: v1.10.7
  NDK_VERSION: 26.1.10909125

jobs:
  build:
    name: Compile KanisVPN
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Android NDK
        run: |
          sdkmanager --install \
            "ndk;${NDK_VERSION}" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV
          echo "$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_PATH

      - name: Build sing-box libbox
        run: |
          git clone --depth 1 \
            --branch "$SING_BOX_TAG" \
            https://github.com/SagerNet/sing-box.git \
            /tmp/sing-box

          cd /tmp/sing-box

          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.4
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.4

          export PATH="$(go env GOPATH)/bin:$PATH"

          go run ./cmd/internal/build_libbox -target android

          test -f libbox.aar

          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp libbox.aar "$GITHUB_WORKSPACE/app/libs/libbox.aar"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KanisVPN-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

          
